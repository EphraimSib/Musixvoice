name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Set up release signing (optional)
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_PASSWORD" ] && [ -f signing/musixvoice.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in signing/musixvoice.jks.enc -out android/app/release.jks -pass env:KEY_PASSWORD
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=musixvoice\nstoreFile=release.jks\n' "$KEY_PASSWORD" "$KEY_PASSWORD" > android/key.properties
            echo "Signing with the release key"
          else
            echo "No signing secret found, using the debug key"
          fi

      - run: flutter pub get

      - name: Build universal APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk Musixvoice.apk

      - name: Build per-phone APKs
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Musixvoice-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Musixvoice-armeabi-v7a.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Musixvoice-apk
          path: |
            Musixvoice.apk
            Musixvoice-arm64-v8a.apk
            Musixvoice-armeabi-v7a.apk

      - name: Attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Musixvoice.apk
            Musixvoice-arm64-v8a.apk
            Musixvoice-armeabi-v7a.apk
